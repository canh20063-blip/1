    <script>
      // Suppress WebSocket and HMR connection errors in preview / iframe environments
      (function() {
        function shouldSuppress(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason || err || '');
          var stack = String(err.stack || '');
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite:ws') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('client.mjs') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          );
        }

        window.addEventListener(
          'unhandledrejection',
          function(event) {
            if (shouldSuppress(event.reason)) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function(event) {
            if (shouldSuppress(event.error || event.message)) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
          },
          true
        );
      })();
    </script>
